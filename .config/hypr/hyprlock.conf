# ─────────────────────────────────────────────── BACKGROUND (unchanged)
background {
    monitor =
    path = /home/vishalbasnet23/.cache/current_wallpaper
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ─────────────────────────────────────────────── GENERAL
general {
    no_fade_in = true
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# ─────────────────────────────────────────────── TIME (top left)
# AM/PM is inline via pango markup rather than a second label, so it can't
# wrap onto its own line. Base size comes from font_size; the span overrides it.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M')<span size='18000' foreground='##d8dee9b0'> $(date +'%p')</span>"
    color = rgba(216, 222, 233, 0.95)
    font_size = 64
    font_family = Maple Mono NF CN
    position = 40, -40
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Kathmandu time, under the clock
label {
    monitor =
    text = cmd[update:1000] echo "󰅐  KTM $(TZ='Asia/Kathmandu' date +'%I:%M %p')"
    color = rgba(216, 222, 233, 0.55)
    font_size = 12
    font_family = Maple Mono NF CN
    position = 46, -136
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── DATE (top right)
label {
    monitor =
    text = cmd[update:60000] echo -e "$(LC_TIME=en_US.UTF-8 date +'%A')"
    color = rgba(216, 222, 233, 0.95)
    font_size = 17
    font_family = Maple Mono NF CN
    position = -40, -46
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:60000] echo -e "$(LC_TIME=en_US.UTF-8 date +'%B %d, %Y')"
    color = rgba(216, 222, 233, 0.68)
    font_size = 12
    font_family = Maple Mono NF CN
    position = -40, -78
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── AVATAR
# Soft ring behind the photo. Slightly larger than the image = visible halo.
shape {
    monitor =
    size = 122, 122
    color = rgba(255, 255, 255, 0.05)
    rounding = -1
    border_size = 1
    border_color = rgba(216, 222, 233, 0.18)
    position = 0, 150
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/Pictures/profile.jpeg
    size = 108
    border_size = 2
    border_color = rgba(216, 222, 233, 0.62)
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 150
    halign = center
    valign = center
}

# ─────────────────────────────────────────────── IDENTITY
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.97)
    font_size = 16
    font_family = Maple Mono NF CN
    position = 0, 62
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:0] echo "$(hostnamectl --static 2>/dev/null || hostname)"
    color = rgba(216, 222, 233, 0.55)
    font_size = 11
    font_family = Maple Mono NF CN
    position = 0, 38
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── INPUT FIELD
# Now actually visible when empty: faint fill + border, fully rounded.
input-field {
    monitor =
    size = 300, 52
    rounding = 26
    outline_thickness = 2
    outer_color = rgba(216, 222, 233, 0.16)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(216, 222, 233, 0.95)
    check_color = rgba(136, 192, 208, 0.85)
    fail_color = rgba(191, 97, 106, 0.85)
    capslock_color = rgba(235, 203, 139, 0.85)

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false
    font_family = Maple Mono NF CN

    # NOTE: $PROMPT / $FPRINTMESSAGE are not substituted here in 0.9.x, so this
    # is static. Live fingerprint status lives in its own label below.
    placeholder_text = <span foreground="##d8dee9cc">Touch sensor or type password</span>
    fail_text = <span foreground="##bf616a"><i>$FAIL</i>  <b>($ATTEMPTS/3)</b></span>

    position = 0, -30
    halign = center
    valign = center
}

# ─────────────────────────────────────────────── FINGERPRINT INDICATOR
shape {
    monitor =
    size = 54, 54
    color = rgba(255, 255, 255, 0.04)
    rounding = -1
    border_size = 1
    border_color = rgba(136, 192, 208, 0.35)
    position = 0, -120
    halign = center
    valign = center
}

# 󰈷 = nf-md-fingerprint. If it renders as a box, your font lacks the glyph —
# try 󰈷 (U+F0237) or fall back to a plain "◉".
label {
    monitor =
    text = 󰈷
    color = rgba(136, 192, 208, 0.95)
    font_size = 24
    font_family = Maple Mono NF CN
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

label {
    monitor =
    text = Touch the sensor
    color = rgba(216, 222, 233, 0.62)
    font_size = 11
    font_family = Maple Mono NF CN
    position = 0, -162
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── NOW PLAYING (bottom)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/Scripts/songdetail.sh)"
    color = rgba(216, 222, 233, 0.62)
    font_size = 13
    font_family = Maple Mono NF CN
    position = 0, 58
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── STATUS (bottom right)
label {
    monitor =
    text = cmd[update:30000] echo "󰤨  $(nmcli -t -f NAME connection show --active 2>/dev/null | head -1)"
    color = rgba(216, 222, 233, 0.55)
    font_size = 11
    font_family = Maple Mono NF CN
    position = -40, 56
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%  $(cat /sys/class/power_supply/BAT0/status 2>/dev/null)"
    color = rgba(216, 222, 233, 0.55)
    font_size = 11
    font_family = Maple Mono NF CN
    position = -40, 34
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ─────────────────────────────────────────────── AUTH
auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type password
        present_message = Scanning fingerprint…
        retry_delay = 1500
    }
}
