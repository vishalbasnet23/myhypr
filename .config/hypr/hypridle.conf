# Hypridle — updated for Hyprland 0.56 Lua dispatchers

$iDIR = $HOME/.config/swaync/images/ja.png

general {
    # Caelestia has its own real lock screen (WlSessionLock + PAM + fingerprint,
    # modules/lock/) that auto-themes with the active colour scheme. lock_cmd fires
    # on the logind "Lock" D-Bus signal - pointing it at hyprlock here would spawn a
    # second, unthemed, competing lock client fighting caelestia's for the same
    # ext-session-lock-v1 protocol slot. Use caelestia's own lock instead.
    lock_cmd = qs -c caelestia ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# Screen off quickly once already locked
listener {
    timeout = 30
    on-timeout = sh -c 'test "$(qs -c caelestia ipc call lock isLocked)" = "true" && hyprctl dispatch "hl.dsp.dpms(\"off\")"'
    on-resume  = sh -c 'test "$(qs -c caelestia ipc call lock isLocked)" = "true" && hyprctl dispatch "hl.dsp.dpms(\"on\")"'
}

# Idle warning
listener {
    timeout = 1080                              # 18 min
    on-timeout = notify-send -i $iDIR " You are idle!"
    on-resume  = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"
}

# Lock, display-off and suspend are handled by caelestia's own idle system now
# (general.idle.timeouts in shell.json) - it respects the "Keep awake" toggle and
# audio/charging inhibitors, which duplicate listeners here would not. Keep this
# file to the things that system doesn't do: the warning above, and the
# screen-off-quickly-once-locked listener below.
