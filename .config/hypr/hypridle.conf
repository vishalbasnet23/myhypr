# Hypridle — updated for Hyprland 0.56 Lua dispatchers

$iDIR = $HOME/.config/swaync/images/ja.png

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# Screen off quickly once already locked
listener {
    timeout = 30
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Idle warning
listener {
    timeout = 540                               # 9 min
    on-timeout = notify-send -i $iDIR " You are idle!"
    on-resume  = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"
}

# Lock
listener {
    timeout = 600                               # 10 min
    on-timeout = loginctl lock-session
}

# Display off
listener {
    timeout = 630                               # 10.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend
listener {
    timeout = 1200                              # 20 min
    on-timeout = systemctl suspend
}
